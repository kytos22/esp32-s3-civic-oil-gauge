[platformio]
default_envs = native

[env:native]
platform = native
test_framework = unity
lib_deps =
build_flags =
    -std=gnu++17
    -Iinclude
    -Isrc
    -DUNITY_INCLUDE_DOUBLE
test_build_src = yes
build_src_filter =
    +<gauge_core.cpp>
    +<demo_sequence.cpp>
    +<warning_tone_gate.cpp>
    +<gauge_settings.cpp>
