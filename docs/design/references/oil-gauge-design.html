}

.form-check-label {

}

.form-switch .form-check-input {

  height: 20px;

  box-shadow: none;

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;

  box-shadow: var(--shadow-sm);

.form-switch .form-check-input:checked {

.form-switch .form-check-input:checked::before {

.form-range::-moz-range-track {

svg {

  height: auto;

#widget &gt; svg {

}

  (() =&gt; {
    const root = document.getElementById(&#x27;oilGaugeRefinedIcons&#x27;);
    const pressureHalf = root.querySelector(&#x27;.ogr-pressure&#x27;);
    const screen = root.querySelector(&#x27;.ogr-screen&#x27;);
    const temperatureHalf = root.querySelector(&#x27;.ogr-temperature&#x27;);
    const pressureInput = document.getElementById(&#x27;ogrPressureInput&#x27;);
    const rpmInput = document.getElementById(&#x27;ogrRpmInput&#x27;);
    const temperatureInput = document.getElementById(&#x27;ogrTemperatureInput&#x27;);
    const unitInput = document.getElementById(&#x27;ogrUnitInput&#x27;);
    const temperatureUnitInput = document.getElementById(&#x27;ogrTemperatureUnitInput&#x27;);
    const warningModeInput = document.getElementById(&#x27;ogrWarningModeInput&#x27;);
    const pressureValue = document.getElementById(&#x27;ogrPressureValue&#x27;);
    const temperatureValue = document.getElementById(&#x27;ogrTemperatureValue&#x27;);
    const fullWarningValue = document.getElementById(&#x27;ogrFullWarningValue&#x27;);
    const pressureUnit = document.getElementById(&#x27;ogrPressureUnit&#x27;);
    const temperatureUnit = document.getElementById(&#x27;ogrTemperatureUnit&#x27;);
    const pressureState = document.getElementById(&#x27;ogrPressureState&#x27;);
    const temperatureState = document.getElementById(&#x27;ogrTemperatureState&#x27;);
    const pressureFill = document.getElementById(&#x27;ogrPressureFill&#x27;);
    const temperatureFill = document.getElementById(&#x27;ogrTemperatureFill&#x27;);
    const pressureControlValue = document.getElementById(&#x27;ogrPressureControlValue&#x27;);
    const rpmControlValue = document.getElementById(&#x27;ogrRpmControlValue&#x27;);
    const temperatureControlValue = document.getElementById(&#x27;ogrTemperatureControlValue&#x27;);
    const formatRpm = new Intl.NumberFormat(&#x27;es-ES&#x27;);
    const yellow = [255, 176, 32];
    const red = [255, 57, 72];

    const mix = (start, end, amount) =&gt; start.map((channel, index) =&gt;
      Math.round(channel + (end[index] - channel) * amount)
    );

    const toRgb = (color) =&gt; `rgb(${color[0]}, ${color[1]}, ${color[2]})`;

    const temperatureColor = (temperature) =&gt; {
      const stops = [
        [50, [30, 132, 255]],
        [59, [30, 132, 255]],
        [76, [174, 205, 167]],
        [90, [174, 205, 167]],
        [96, [234, 190, 82]],
        [100, [255, 118, 28]],
        [138, [255, 45, 56]]
      ];

      if (temperature &lt;= stops[0][0]) return toRgb(stops[0][1]);
      if (temperature &gt;= stops[stops.length - 1][0]) return toRgb(stops[stops.length - 1][1]);

      for (let index = 1; index &lt; stops.length; index += 1) {
        const [nextValue, nextColor] = stops[index];
        const [previousValue, previousColor] = stops[index - 1];
        if (temperature &lt;= nextValue) {
          const amount = (temperature - previousValue) / (nextValue - previousValue);
          return toRgb(mix(previousColor, nextColor, amount));
        }
      }

      return toRgb(stops[stops.length - 1][1]);
    };

    const getPressureState = (psi, rpm) =&gt; {
      if (rpm === 0) return [&#x27;stopped&#x27;, &#x27;Motor parado&#x27;];
      if (psi &lt;= 10) return [&#x27;warning&#x27;, &#x27;Warning&#x27;];
      if (psi &lt; 15) return [&#x27;low&#x27;, &#x27;Presión baja&#x27;];
      if (psi &lt;= 80) return [&#x27;ok&#x27;, &#x27;OK&#x27;];
      return [&#x27;high&#x27;, &#x27;Presión alta&#x27;];
    };

    const getTemperatureState = (temperature) =&gt; {
      if (temperature &lt; 60) return [&#x27;cold&#x27;, &#x27;Frío&#x27;];
      if (temperature &lt; 76) return [&#x27;warming&#x27;, &#x27;Calentando&#x27;];
      if (temperature &lt; 96) return [&#x27;optimal&#x27;, &#x27;Óptimo&#x27;];
      if (temperature &lt;= 100) return [&#x27;hot&#x27;, &#x27;Caliente&#x27;];
      return [&#x27;very-hot&#x27;, &#x27;Muy caliente&#x27;];
    };

    const update = () =&gt; {
      const psi = Number(pressureInput.value);
      const rpm = Number(rpmInput.value);
      const temperature = Number(temperatureInput.value);
      const [pressureKey, pressureLabel] = getPressureState(psi, rpm);
      const [temperatureKey, temperatureLabel] = getTemperatureState(temperature);
      const pressureColor = pressureKey === &#x27;warning&#x27; ? toRgb(red) : toRgb(yellow);
      const currentTemperatureColor = temperatureColor(temperature);
      const bar = unitInput.value === &#x27;bar&#x27;;
      const fahrenheit = temperatureUnitInput.value === &#x27;fahrenheit&#x27;;
      const displayedTemperature = fahrenheit ? (temperature * 9 / 5) + 32 : temperature;
      const temperatureDisplay = temperature &lt; 50
        ? (fahrenheit ? &#x27;&lt;122&#x27; : &#x27;&lt;50&#x27;)
        : String(Math.round(displayedTemperature));
      const pressureDisplay = bar ? (psi * 0.0689475729).toFixed(1) : String(psi);

      screen.dataset.warningMode = warningModeInput.value;
      pressureHalf.dataset.state = pressureKey;
      temperatureHalf.dataset.state = temperatureKey;
      pressureHalf.style.setProperty(&#x27;--ogr-metric-color&#x27;, pressureColor);
      temperatureHalf.style.setProperty(&#x27;--ogr-metric-color&#x27;, currentTemperatureColor);
      pressureValue.textContent = pressureDisplay;
      fullWarningValue.textContent = pressureDisplay;
      pressureUnit.textContent = bar ? &#x27;BAR&#x27; : &#x27;PSI&#x27;;
      temperatureUnit.textContent = fahrenheit ? &#x27;°F&#x27; : &#x27;°C&#x27;;
      temperatureValue.textContent = temperatureDisplay;
      pressureState.textContent = pressureLabel;
      temperatureState.textContent = temperatureLabel;
      pressureFill.style.width = `${(psi / 150) * 100}%`;
      temperatureFill.style.width = `${Math.max(0, ((temperature - 50) / 88) * 100)}%`;
      pressureControlValue.textContent = `${pressureDisplay} ${bar ? &#x27;BAR&#x27; : &#x27;PSI&#x27;}`;
      rpmControlValue.textContent = formatRpm.format(rpm);
      temperatureControlValue.textContent = `${Math.round(displayedTemperature)} ${fahrenheit ? &#x27;°F&#x27; : &#x27;°C&#x27;}`;
      pressureHalf.setAttribute(&#x27;aria-label&#x27;, `Presión de aceite ${pressureDisplay} ${bar ? &#x27;bar&#x27; : &#x27;PSI&#x27;}, ${pressureLabel}, motor a ${rpm} RPM`);
      temperatureHalf.setAttribute(
        &#x27;aria-label&#x27;,
        temperature &lt; 50
          ? `Temperatura de aceite por debajo de ${fahrenheit ? &#x27;122 grados Fahrenheit&#x27; : &#x27;50 grados Celsius&#x27;}, ${temperatureLabel}`
          : `Temperatura de aceite ${Math.round(displayedTemperature)} grados ${fahrenheit ? &#x27;Fahrenheit&#x27; : &#x27;Celsius&#x27;}, ${temperatureLabel}`
      );
    };

    [pressureInput, rpmInput, temperatureInput, unitInput, temperatureUnitInput, warningModeInput].forEach((input) =&gt; {
      input.addEventListener(&#x27;input&#x27;, update);
    });

    update();
  })();
&lt;/script&gt;


&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;

    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;

    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };

      .then(({ x, y }) =&gt; {

        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {

  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }

    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);

    setDescribedBy(trigger, true);

      updatePosition(trigger, floating);

    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;

    }

    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);

  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
